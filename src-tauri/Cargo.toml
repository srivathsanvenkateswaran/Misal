[package]
name = "misal"
version = "0.0.0"
description = "Local-first investment tracker"
authors = ["Srivathsan Venkateswaran"]
license = "AGPL-3.0-only"
repository = "https://github.com/srivathsanvenkateswaran/Misal"
edition = "2021"
rust-version = "1.77"

[lib]
name = "misal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# bundled-sqlcipher gives encryption at rest without depending on a system SQLite build,
# which matters when shipping a single binary to three operating systems.
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "chrono", "backup"] }

# OS keychain: Keychain on macOS, Credential Manager on Windows, Secret Service on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
directories = "5"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
