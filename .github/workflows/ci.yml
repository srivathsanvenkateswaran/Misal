name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # The production build is a separate failure surface from typecheck: Vite resolves imports,
      # inlines assets and runs the plugin chain here and nowhere else. Without this step the first
      # place a broken build appears is the release workflow, i.e. at the moment it matters most.
      - run: pnpm build

  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux build needs GTK and WebKit; the other platforms ship theirs.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` reads `frontendDist` at compile time and panics if the directory
      # is absent, so the core crate does not compile at all without one — which is why every Core
      # job on this workflow had failed since the day it was written, while the same commands passed
      # on any developer machine that had ever run `pnpm build`.
      #
      # A stub rather than a real build: these are the Rust library tests. They never serve the
      # frontend, and building it on three platforms would add a Node toolchain and several minutes
      # to each for a directory nothing here reads. The real build is verified once, in the Frontend
      # job above.
      - name: Stub the frontend bundle
        shell: bash
        run: |
          mkdir -p dist
          echo '<!doctype html><title>stub</title>' > dist/index.html

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The storage tests cover encryption at rest, migration idempotency and the
      # identity constraints that stop a holding being counted twice.
      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

  secrets-scan:
    name: No committed statements or secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject financial documents and database files
        run: |
          # Real statements and databases must never enter the repository. The parser test
          # corpus is redacted or synthetic; anything else is a leak of someone's holdings.
          if git ls-files | grep -iE '\.(pdf|sqlite|sqlite3|db)$'; then
            echo "::error::Financial documents or database files must not be committed."
            exit 1
          fi
          if git ls-files | grep -iE '(^|/)(statements|scratch)/'; then
            echo "::error::Statement directories must not be committed."
            exit 1
          fi
          echo "clean"

      - name: Reject non-text source files
        run: |
          # A source file containing a NUL byte is treated as binary by grep, ripgrep and most
          # review tooling, which silently skip it. src/valuation/fold.ts - the FIFO engine -
          # spent this project's entire history invisible to every grep run against it, because
          # two separator bytes in a hash input were written literally instead of as \u0000.
          # Same value, same behaviour, and unreviewable.
          bad=$(git ls-files 'src/**' 'src-tauri/src/**' | while read -r f; do
            if LC_ALL=C grep -qP '\x00' "$f" 2>/dev/null; then echo "$f"; fi
          done)
          if [ -n "$bad" ]; then
            echo "::error::Source files contain NUL bytes and are unreadable to grep:"
            echo "$bad"
            exit 1
          fi
          echo "all source files are text"
